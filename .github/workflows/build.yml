name: build-apk
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore signing key
        run: base64 -d app/keystore/hondadash.jks.b64 > app/keystore/hondadash.jks
      - name: Build
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk HondaDash.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HondaDash
          path: HondaDash.apk
      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest HondaDash.apk -t "HondaDash build ${{ github.run_number }}" -n "Commit ${{ github.sha }}"
